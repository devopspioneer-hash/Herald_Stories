# Shared pytest config for all Django services.
#
# Every service uses the same settings module path (config.settings), so run
# tests per service, from inside that service:
#     cd services/auth && pytest
# pytest-django finds the service's manage.py and puts that folder on sys.path.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
django_find_project = true
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --reuse-db
markers =
    slow: long-running test
    integration: needs real Postgres / Redis / MinIO
filterwarnings =
    error
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*
